version: "2"

run:
  timeout: 5m
  # golangci-lint v2.12.2 (current latest as of writing) is itself built
  # with go1.25 and refuses to analyze a go.mod targeting a newer Go
  # version than that. Pinning the analysis target here decouples that
  # from go.mod's own `go 1.26.5` directive — we don't use any
  # 1.26-exclusive syntax, so this is safe until golangci-lint catches up.
  go: "1.25"

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - unused
    - ineffassign
    - errcheck
    - misspell
    - revive
    - bodyclose
    - noctx
    - gosec
    - unconvert
    - unparam
  settings:
    staticcheck:
      checks:
        - all
    revive:
      rules:
        - name: exported
    errcheck:
      exclude-functions:
        - (io.Closer).Close
    misspell:
      locale: US
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/ThisIsQasim/token-auth-proxy

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
