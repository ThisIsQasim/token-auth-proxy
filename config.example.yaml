# Every field here can also be set via a CLI flag or a TAP_-prefixed env
# var, which take precedence over this file and are re-applied on every
# reload (not just at startup) — see the README's Configuration section.

# Any string value in this file may pull its value in from elsewhere:
#   ${env:NAME}       the environment variable NAME (must be set)
#   ${file:/path}     the file's contents, one trailing newline stripped
#                     (a relative path resolves against this file's
#                     directory)
# Both can appear mid-string and more than once ("https://${env:HOST}/x"),
# and are re-resolved on every reload. '$' is only special immediately
# before '{', so values that contain a bare '$' — a bcrypt hash, say —
# need no escaping; write "$${" if you ever need a literal "${". A
# reference that can't be resolved fails the load and keeps the previous
# config running. See the README's "Value references" section.

# Observability (traces/metrics/logs) is configured entirely via
# standard OTEL_* environment variables, not this file — there is no
# telemetry:/otel: section here to look for. /metrics is always mounted
# and unauthenticated regardless. See the README's Observability
# section.

# Address the proxy listens on. Read once at startup; changing this
# requires a process restart to take effect.
listen_addr: ":8080"

# Backend to forward every request to. Must be an absolute http(s) URL.
# Hot-reloads: edit it (or replace this file atomically, e.g. via `mv`)
# and the proxy picks up the change without a restart, with no dropped
# in-flight requests. (inbound.auth below hot-reloads too — see its own
# comment; listen_addr/timeouts above are the only fields that don't.)
target: "http://localhost:9000"

# Optional. All fields have sane defaults if omitted. Like listen_addr,
# these are read once at startup — changing them requires a restart.
timeouts:
  read_header: 5s
  read: 30s
  write: 30s
  idle: 120s
  dial: 5s
  response_header: 15s

# Optional. Describes trusted credential sources. All three are
# enforced: a request matching a configured, non-disabled jwt source's
# issuer must carry a valid token or the proxy responds 401; with a
# basic source configured, a request must carry a matching
# username/password or gets a 401 challenge; with a saml source
# configured and enabled, an unauthenticated request is redirected to
# the IdP instead (see the README's Auth section for how they combine
# when more than one is configured). Like target, inbound.auth
# hot-reloads with no process restart.
#
# Each can also be set (or overridden) via --inbound-auth-jwt-json/
# TAP_INBOUND_AUTH_JWT_JSON (a JSON array, fully replacing the jwt
# list), --inbound-auth-saml-json/TAP_INBOUND_AUTH_SAML_JSON and
# --inbound-auth-basic-json/TAP_INBOUND_AUTH_BASIC_JSON (JSON objects,
# fully replacing that source) — see the README's Auth section. All
# forms share the same field names.
#
# jwt is a list (multiple trusted issuers); saml and basic are each at
# most one source, not a list — see the README's Auth section for why.
#
# There is no separate "enabled" key: adding a source below that isn't
# disabled turns that mode on immediately. To stage a fully-written
# source without going live, mark it disabled: true.
#
# Commented out entirely so the default `make run` config stays fully
# functional without a real JWKS or IdP endpoint on hand.
# inbound:
#   auth:
#     jwt:
#       # algorithms/credentials both omitted here — they default to
#       # ["RS256"] and [{header, Authorization, "Bearer "}] respectively.
#       - name: internal-k8s
#         issuer: "https://kubernetes.default.svc"
#         jwks_url: "https://kubernetes.default.svc/openid/v1/jwks"
#         audiences: ["token-auth-proxy"]
#
#       - name: partner-oidc
#         issuer: "https://partner.example.com"
#         oidc_discovery_url: "https://partner.example.com/.well-known/openid-configuration"
#         algorithms: ["RS256", "ES256"]
#         # Credentials is a list, tried in order: header first, then a
#         # cookie fallback for browser-originated requests.
#         credentials:
#           - location: header
#             name: Authorization
#             prefix: "Bearer "
#           - location: cookie
#             name: partner_session
#         jwks_cache_ttl: 10m
#         disabled: true # staged, not live yet
#
#     # At most one basic source, with a fixed list of users. Passwords
#     # are only ever stored as bcrypt hashes — a plaintext password
#     # here is rejected at startup, not silently accepted. Generate one
#     # with `htpasswd -bnBC 12 "" 'password' | tr -d ':\n'`.
#     #
#     # A bcrypt hash is a verifier, not a credential — it can't be
#     # replayed against this proxy — so it's fine directly in this
#     # file, quoted as below. Where you'd rather have it delivered by
#     # your secret management (a Kubernetes Secret, /run/secrets/...),
#     # the ${file:...}/${env:...} references described at the top of
#     # this file work here like anywhere else.
#     basic:
#       # Optional; defaults to "restricted". Shown by browsers in
#       # their login dialog, and used by clients to scope a saved
#       # password, so it's worth setting to something recognizable.
#       realm: "internal tools"
#       users:
#         - username: alice
#           password_hash: "$2y$12$QOOD13Yck.hsJKS7hrNR8uUtZn2ygUwHk.WmrC6r49jtPUgc7YX3W"
#         - username: bob
#           password_hash: "${file:/run/secrets/bob.bcrypt}"
#       # disabled: true # staged, not live yet
#
#     saml:
#       name: corp-sso
#       issuer: "https://idp.corp.example.com/metadata" # the IdP's entity ID
#       idp_metadata_url: "https://idp.corp.example.com/metadata"
#       # This proxy's own externally-reachable origin — required, no
#       # default. Must be https:// in any real deployment: the IdP's
#       # ACS POST is cross-site, so the tracking cookie needs
#       # SameSite=None, which browsers only honor on Secure (https)
#       # cookies. http:// is accepted (and warned about at startup)
#       # for local dev/test only.
#       sp_base_url: "https://proxy.example.com"
#       sp_entity_id: "https://proxy.example.com/saml/metadata"
#       acs_path: "/saml/corp-sso/acs"
#       session_cookie: "corp_sso_session"
#       # Names an environment variable holding the session-signing
#       # key — never the key itself in this file. It must already be
#       # set (to at least 32 bytes) for the proxy to start; here it'd
#       # need to be, e.g., `export CORP_SSO_SESSION_KEY=...` before
#       # running.
#       session_signing_key_env: "CORP_SSO_SESSION_KEY"
#       session_duration: 8h
#       idp_metadata_cache_ttl: 1h # optional, defaults shown
#       #
#       # Optional, and must be set together (or not at all): a
#       # persistent RSA keypair this proxy advertises as an encryption
#       # key in its own SP metadata, so the IdP can send (and this
#       # proxy will transparently decrypt) EncryptedAssertion elements
#       # instead of plaintext ones. Needed for Shibboleth-based IdPs
#       # (which default to encrypting assertions) and IdPs joined to
#       # the InCommon/eduGAIN research-and-education federations
#       # (whose membership profile requires SP-side decryption
#       # support); not needed for commercial SaaS IdPs (Okta, Entra
#       # ID, ...) in their default configuration. Does NOT enable
#       # signed AuthnRequests, a separate, still-unsupported feature —
#       # see the README's SAML section.
#       #
#       # sp_key_env names an environment variable holding a
#       # PEM-encoded RSA private key (PKCS#1 or PKCS#8) — never the
#       # key itself in this file, same convention as
#       # session_signing_key_env above. sp_cert is the matching
#       # PEM-encoded certificate; being public, it's fine directly
#       # here, unlike the key.
#       # sp_key_env: "CORP_SSO_SP_KEY"
#       # sp_cert: |
#       #   -----BEGIN CERTIFICATE-----
#       #   MIIC...
#       #   -----END CERTIFICATE-----
#
# outbound: {} # reserved for later: rewriting credentials on the backend leg
