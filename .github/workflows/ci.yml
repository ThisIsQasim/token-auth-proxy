name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: "1.26.5"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --build-tags=integration,load

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      # -json's machine-readable stream is what test-reporter below
      # renders into an actual pass/fail summary (see its step comment);
      # `set -o pipefail` (not GitHub Actions' default for `run:`) makes
      # this step still fail on a real test failure even though tee is
      # the last command in the pipeline.
      - name: Run unit tests
        run: |
          set -o pipefail
          go test -race -covermode=atomic -coverprofile=coverage.out -json ./... | tee test-results.json
      # Raw go test output only ever showed up as text in this job's own
      # log, easy to miss; this renders an actual pass/fail/skip summary
      # directly into this job's own Summary tab (use-actions-summary is
      # the default, kept explicit here as documentation — verified by
      # reading dorny/test-reporter's dist/index.js: 'false' takes a
      # different code path that creates a separate Check Run via the
      # Checks API instead, which needs its own checks:write permission
      # and — confirmed by actually pushing and checking — does *not*
      # appear anywhere on this workflow run's own page, only under the
      # commit's separate Checks list or its own standalone URL; 'true'
      # is what actually answers "show it on the workflow page").
      # if: always() so a failing test suite (the case that matters most)
      # still gets a report, not just a green run.
      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Unit Tests
          path: test-results.json
          reporter: golang-json
          use-actions-summary: 'true'

  test-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go build -o bin/token-auth-proxy ./cmd/token-auth-proxy
      - name: Run integration tests
        run: |
          set -o pipefail
          go test -tags=integration -race -timeout=120s -json ./test/integration/... | tee test-results.json
      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Integration Tests
          path: test-results.json
          reporter: golang-json
          use-actions-summary: 'true'

  load-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go build -o bin/token-auth-proxy ./cmd/token-auth-proxy
      - name: Run load test
        env:
          LOAD_TEST_REPORT_PATH: ${{ github.workspace }}/load-test-report.json
        run: |
          set -o pipefail
          go test -tags=load -race -timeout=120s -json ./test/load/... | tee test-results.json
      # The load test is a single pass/fail test per scenario (no
      # subtests), so dorny/test-reporter's Check below only ever says
      # "2 passed" — correct, but tells you nothing about the numbers
      # that actually matter for a load test (throughput, latency
      # percentiles, resource usage — and, since baseline and jwt-auth
      # both run, the overhead auth adds), which otherwise only exist
      # inside the load-test-report-*.json artifacts someone has to
      # download and open by hand. Render them straight into this job's
      # own Summary tab instead, one table per scenario file found — jq
      # ships preinstalled on GitHub-hosted runners.
      - name: Summarize load test report
        if: always()
        run: |
          shopt -s nullglob
          files=(load-test-report-*.json)
          if [ ${#files[@]} -eq 0 ]; then
            {
              echo "## Load Test Report"
              echo ""
              echo "_No report found — the test likely failed before any attack run completed._"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for f in "${files[@]}"; do
            name=$(jq -r '.name' "$f")
            {
              echo "## Load Test Report: $name"
              echo ""
              echo "| Metric | Value |"
              echo "|---|---|"
              jq -r '
                "| Requests | \(.requests) |",
                "| Success rate | \((.success * 100) | round)% |",
                "| Throughput | \(.throughput_rps | round) req/s |",
                "| p50 latency | \(.latency_p50) |",
                "| p95 latency | \(.latency_p95) |",
                "| p99 latency | \(.latency_p99) |",
                "| Max latency | \(.latency_max) |",
                "| Peak CPU | \(.resources.peak_cpu_percent | round)% |",
                "| Avg CPU | \(.resources.avg_cpu_percent | round)% |",
                "| Peak RSS | \((.resources.peak_rss_bytes / 1048576) | round) MB |",
                "| Avg RSS | \((.resources.avg_rss_bytes / 1048576) | round) MB |"
              ' "$f"
              echo ""
              echo "Status codes: \`$(jq -c '.status_codes' "$f")\`"
              errors=$(jq -c '.errors // []' "$f")
              if [ "$errors" != "[]" ] && [ "$errors" != "null" ]; then
                echo ""
                echo "**Errors:** \`$errors\`"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Load Tests
          path: test-results.json
          reporter: golang-json
          use-actions-summary: 'true'
      # Uploaded even if the load test fails, so a regression's numbers
      # are still inspectable rather than only a pass/fail result.
      - name: Upload load test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: load-test-report
          path: load-test-report-*.json
          if-no-files-found: warn
          retention-days: 30

  docker:
    needs: [lint, test, test-integration, load-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=,format=short
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
